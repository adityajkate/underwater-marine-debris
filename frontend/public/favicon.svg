<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Abyssal Oceanic Gradient -->
    <linearGradient id="ns-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b32" />
      <stop offset="60%" stop-color="#062620" />
      <stop offset="100%" stop-color="#021411" />
    </linearGradient>

    <!-- Vibrant Seafoam Wave Gradient -->
    <linearGradient id="ns-wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Deep Teal Secondary Wave -->
    <linearGradient id="ns-wave-deep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Glow for Detection Target -->
    <filter id="ns-target-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Mint Edge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ns-bg-grad)" stroke="#10b981" stroke-width="1.75" stroke-opacity="0.4" />

  <!-- Background Sonar Wave Pulses -->
  <circle cx="32" cy="32" r="22" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.15" />
  <circle cx="32" cy="32" r="14" stroke="#6ee7b7" stroke-width="1.2" stroke-opacity="0.22" />

  <!-- Lower Oceanic Wave (Layer 1 - Deep Depth) -->
  <path d="M8 44 C 16 38, 24 38, 32 44 C 40 50, 48 50, 56 44 L 56 50 C 48 56, 40 56, 32 50 C 24 44, 16 44, 8 50 Z" fill="url(#ns-wave-deep)" opacity="0.7" />

  <!-- Primary Oceanic Wave Crest (Layer 2 - Luminous Seafoam) -->
  <path d="M8 36 C 16 28, 24 28, 32 36 C 40 44, 48 44, 56 36 L 56 43 C 48 51, 40 51, 32 43 C 24 35, 16 35, 8 43 Z" fill="url(#ns-wave-grad)" />

  <!-- Underwater AI Detection Targeting Reticle (Upper Right) -->
  <!-- Crosshair tick marks -->
  <path d="M42 16 L42 20" stroke="#6ee7b7" stroke-width="1.75" stroke-linecap="round" />
  <path d="M42 24 L42 28" stroke="#6ee7b7" stroke-width="1.75" stroke-linecap="round" />
  <path d="M36 22 L40 22" stroke="#6ee7b7" stroke-width="1.75" stroke-linecap="round" />
  <path d="M44 22 L48 22" stroke="#6ee7b7" stroke-width="1.75" stroke-linecap="round" />

  <!-- Targeting Ring -->
  <circle cx="42" cy="22" r="4.5" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.8" fill="none" />

  <!-- Luminous Detection Target Ping (Center Focal Point) -->
  <circle cx="42" cy="22" r="2.2" fill="#6ee7b7" filter="url(#ns-target-glow)" />
</svg>
