<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#07152b" />
      <stop offset="100%" stop-color="#030816" />
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Scan Glow Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="sonarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Radar Sweep Blur Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />

  <!-- Bathymetric Sonar Grid -->
  <rect width="1200" height="320" fill="url(#sonarGrid)" />

  <!-- Atmospheric Bathymetric Depth Waves -->
  <path d="M 0 240 Q 300 210, 600 245 T 1200 230 L 1200 320 L 0 320 Z" fill="#0c1f38" fill-opacity="0.35" />
  <path d="M 0 270 Q 350 240, 700 280 T 1200 260 L 1200 320 L 0 320 Z" fill="#081426" fill-opacity="0.5" />

  <!-- Scanning Sweep Laser (Animated) -->
  <g>
    <rect x="-120" y="0" width="120" height="320" fill="url(#beamGrad)">
      <animate attributeName="x" from="-120" to="1200" dur="5.5s" repeatCount="indefinite" />
    </rect>
    <line x1="0" y1="0" x2="0" y2="320" stroke="url(#scanGrad)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="x1" from="0" to="1320" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0" to="1320" dur="5.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Circular Radar / Hydrophone Array Target (Animated) -->
  <g transform="translate(1040, 160)">
    <!-- Crosshairs -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#1e293b" stroke-width="1" />
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,4" />
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,4" />

    <!-- Expanding Sonar Pulse 1 -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" from="8" to="80" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.9" to="0" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" from="2" to="0.5" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Expanding Sonar Pulse 2 (Phase Offset) -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="r" from="8" to="80" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.9" to="0" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" from="2" to="0.5" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Ping Center Centerpiece -->
    <circle cx="0" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="102" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="1.5">SONAR ARRAY 24 kHz</text>
  </g>

  <!-- Brand Typography & Telemetry Header -->
  <g transform="translate(70, 75)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">BENTHIC DEBRIS INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      NIRMAL SAGAR
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Turbidity-Invariant Benthic Debris Detection &amp; Ecological Hazard Telemetry
    </text>

    <!-- Monospace Telemetry Pills -->
    <g transform="translate(0, 138)">
      <!-- Pill 1: Architecture -->
      <g>
        <rect x="0" y="0" width="190" height="26" rx="4" fill="#091322" stroke="#1e3a5f" stroke-width="1" />
        <text x="10" y="16.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#38bdf8">ARCH: YOLO11s-seg DUAL</text>
      </g>

      <!-- Pill 2: Scan Method -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="160" height="26" rx="4" fill="#091322" stroke="#1e3a5f" stroke-width="1" />
        <text x="10" y="16.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#38bdf8">SCAN: SAHI MULTI-SCALE</text>
      </g>

      <!-- Pill 3: Taxonomy -->
      <g transform="translate(370, 0)">
        <rect x="0" y="0" width="145" height="26" rx="4" fill="#091322" stroke="#1e3a5f" stroke-width="1" />
        <text x="10" y="16.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#10b981">TAXONOMY: CORE-3</text>
      </g>

      <!-- Pill 4: Telemetry -->
      <g transform="translate(525, 0)">
        <rect x="0" y="0" width="165" height="26" rx="4" fill="#091322" stroke="#1e3a5f" stroke-width="1" />
        <text x="10" y="16.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a78bfa">INDEX: CONTINUOUS EHI</text>
      </g>
    </g>
  </g>

  <!-- Sleek Border Highlight Frame -->
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#1e293b" stroke-width="1" rx="0" />
  <line x1="0" y1="319" x2="1200" y2="319" stroke="url(#accentGrad)" stroke-width="2" />
</svg>
